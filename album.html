<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Álbum de memórias com fotos e textos do Constellation of us."
    />
    <title>Álbum | Constellation of us</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <canvas id="space-canvas" aria-hidden="true"></canvas>
    <div class="ambient-glow ambient-glow-one" aria-hidden="true"></div>
    <div class="ambient-glow ambient-glow-two" aria-hidden="true"></div>

    <header class="site-header">
      <a class="brand" href="./index.html" aria-label="Voltar para o inicio">
        <span class="brand-mark"></span>
        <span>Constellation of us</span>
      </a>
      <nav class="header-actions" aria-label="Navegação do álbum">
        <a class="ghost-button nav-button" href="./index.html">Início</a>
        <a class="primary-button nav-button" href="./index.html#nova">Inserir memória</a>
      </nav>
    </header>

    <main class="album-page">
      <section class="album-hero" aria-labelledby="album-title">
        <p class="eyebrow">Álbum</p>
        <h1 id="album-title">Fotos e textos para rever com calma.</h1>
        <p class="hero-subtitle">
          Uma página separada, sem edição e sem distrações, apenas para olhar as
          memórias em ordem cronológica.
        </p>
      </section>

      <section class="album-only-section" aria-label="Memórias do álbum">
        <div id="album-empty" class="album-empty">
          <h3>Nenhuma imagem para ver ainda.</h3>
          <p>Quando uma memória for criada na página inicial, ela aparece aqui.</p>
        </div>

        <svg
          id="album-path"
          class="album-path"
          viewBox="0 0 120 980"
          preserveAspectRatio="none"
          aria-hidden="true"
          hidden
        >
          <path
            d="M62 8 C18 96 110 176 62 272 C18 360 106 444 62 548 C20 646 112 718 62 836 C42 884 34 928 58 972"
          />
        </svg>

        <div id="album-grid" class="album-grid album-grid-page" aria-live="polite"></div>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <template id="album-template">
      <article class="album-card reveal">
        <img alt="" loading="lazy" />
        <div class="album-content">
          <time></time>
          <h3></h3>
          <p></p>
          <blockquote></blockquote>
        </div>
      </article>
    </template>

    <script type="module" src="./album.js"></script>
  </body>
</html>
